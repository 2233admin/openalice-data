name: OpenAlice Data Beta

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contracts:
    name: Python ${{ matrix.python-version }} contracts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Run OpenBB fork and A-share Provider contracts
        run: >-
          uv run --python ${{ matrix.python-version }}
          --with-editable openbb_platform/core
          --with-editable openbb_platform/providers/ashare
          --with pytest --with pytest-asyncio
          python -m pytest openbb_platform/providers/ashare/tests -q
      - name: Run optional Data Hub contracts
        run: >-
          uv run --python ${{ matrix.python-version }}
          --with-editable openbb_platform/core
          --with-editable openbb_platform/extensions/openalice_data
          --with pytest --with httpx2
          python -m pytest openbb_platform/extensions/openalice_data/tests -q

  container:
    name: Compose image
    runs-on: ubuntu-latest
    needs: contracts
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose
        run: docker compose config -q
      - name: Build complete OpenBB image
        run: docker compose build
      - name: Start OpenAlice service
        run: docker compose up -d
      - name: Verify Provider coverage, readiness, and real OpenBB data
        run: python scripts/verify_openalice_beta.py
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop Beta service
        if: always()
        run: docker compose down
