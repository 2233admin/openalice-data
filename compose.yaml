name: openalice-data

services:
  openalice-data:
    build:
      context: .
      dockerfile: build/docker/openalice-data.Dockerfile
    image: openalice-data:0.1.0-beta.1
    ports:
      - "${OPENALICE_PORT:-6900}:6900"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import json, urllib.request;
          data=json.load(urllib.request.urlopen('http://127.0.0.1:6900/api/v1/coverage/providers', timeout=3));
          assert 'ashare' in data and 'yfinance' in data
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped
