[project]
name = "openalice-ashare-provider"
version = "0.1.0"
description = "A-share market provider for the OpenBB Platform"
requires-python = ">=3.10,<4"
license = {text = "AGPL-3.0-only"}
dependencies = ["openbb-core>=1.6.13,<2", "yfinance>=1.4.0,<2"]

[project.entry-points."openbb_provider_extension"]
ashare = "openbb_ashare:ashare_provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_ashare"]
