[project]
name = "openalice-ashare-provider"
version = "0.1.0"
description = "Internal A-share snapshot provider for OpenAlice Data"
requires-python = ">=3.11,<3.14"
license = {text = "AGPL-3.0-only"}
dependencies = ["openbb-core>=1.6.13,<2"]

[project.entry-points."openbb_provider_extension"]
openalice_ashare = "openbb_ashare:ashare_provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openbb_ashare"]
